name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Install Harbor 0.23.0
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the agent model and provider keys are configured
        # Prints only which names are missing, never a value.
        run: |
          test -n "$CARTWHEEL_MODEL" || { echo "::error::repository variable CARTWHEEL_MODEL is not set"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::secret OPENAI_API_KEY is not set (agent and judge provider)"; exit 1; }

      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # The agent adapter forwards the provider key from this job's
      # environment into each container; task.toml passes the judge
      # provider key to the verifier.
      - name: Run every case five times in fresh Docker containers
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --n-concurrent 2 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # Writes pass count, pass@1, pass@3, pass@5, pass^5 and the CI decision
      # to the job summary; exits 1 when a regression case fails any run.
      - name: Summarize and apply the CI gate
        if: always()
        run: |
          uv run python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --expected-attempts 5

      - name: Upload the Harbor job files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
          include-hidden-files: true
