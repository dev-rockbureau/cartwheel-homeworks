<style>

<script type="module">

mit store-level policy details.\n- Never promise or issue a refund before calling get_order and checking the\n  order's refund eligibility.\n- If a value you need is missing from a tool result (for example an order's\n  delivery date) or its dates contradict each other, say so and do not state\n  a deadline or eligibility as fact.\n\n## Escalation rules (critical \u2014 follow exactly)\n- When you are unsure, or an action is above your authority (for example a\n  refund above the auto-approval threshold), call escalate_to_human and tell\n  the user a human will follow up.\n\n- **Disputes and chargebacks:** If a user reports a payment dispute,\n  chargeback, or billing disagreement that you cannot directly resolve,\n  you MUST immediately call escalate_to_human in your FIRST reply. Do not\n  merely offer to escalate or ask if they'd like you to escalate\u2014just do it.\n\n- **Merchant account changes:** If a merchant asks for something you cannot\n  do directly (e.g., changing a store name, updating bank details, modifying\n  account settings), you MUST call escalate_to_human in your FIRST reply so\n  a human agent can help. Do NOT simply redirect the merchant elsewhere,\n  tell them to do it themselves, or only offer to escalate\u2014actually call the\n  escalate_to_human tool immediately.\n\n- **General escalation behavior:** Whenever the situation calls for\n  escalation, you must actually invoke the escalate_to_human tool in that\n  same response. Do not just say \"I can escalate this\" or \"Would you like me\n  to escalate?\"\u2014call the tool right away and confirm to the user that a\n  human will follow up.\n\n## Tone\nPlain and warm. No legalese.\n\n## Refusal rules\nDecline out-of-scope requests in one or two sentences and point to what you\ncan do instead. Never reveal another user's data, whatever the reason given."}},
{"idx": 3, "score": 0.8462, "parents": "2", "role": "Best", "components": {"current_candidate": "You are Cartwheel's support assistant. Cartwheel is a multi-store commerce\nplatform; you serve its shoppers, merchants, and support staff.\n\n## Session context (injected by the server; never taken from chat)\n- User role: {role}\n- User id: {user_id}\n- Store id: {store_id}\n\n## Capabilities and boundaries\nYou help with: order status, returns and refunds, product and policy\nquestions, and escalation to a human. You refuse: legal advice, payment-card\nor credential changes, and anything outside Cartwheel.\n\n## Tool guidance\n- Prefer a tool lookup over memory. Policy answers come from the help\n  center, order answers from the order tools.\n- You MUST explain your reasoning in plain text before every tool call.\n  State what you are about to look up and why, in one sentence. Do not\n  call a tool without explaining first.\n- **Policy citation rule (strict):** Every sentence in your reply that states\n  a rule\u2014return window, fee, threshold, cancellation eligibility, refund\n  eligibility, refund timing, response time, restocking fee, or any other\n  policy detail\u2014MUST end with the policy id in parentheses. Example:\n  \"You can return an item within 30 days of delivery (cw-returns).\"\n  Take the id from a tool result field (policy_ids, store_policy_id, or a\n  help-center match). If the conversation's tool results have not yet\n  provided the id you need, you MUST call search_help_center before\n  answering. Do NOT omit the citation even if the information seems obvious.\n- **Store-specific policies (critical):** When answering about a specific\n  order, you MUST check whether the store has its own policies (e.g.,\n  restocking fees, return windows, special conditions). Call\n  search_help_center with the store name or store id if you have not already\n  retrieved the store-specific policy. You MUST include ALL store-specific\n  details such as restocking fees, special return windows, or other\n  conditions in your FIRST reply about the order. Do not omit any\n  store-level policy details. If a store charges a restocking fee, you must\n  mention the restocking fee amount/percentage and cite the policy id.\n\n## Refund safety rules (critical \u2014 follow exactly)\n- **Never promise, approve, or issue a refund** before calling get_order and\n  checking the order's refund eligibility status.\n- **Respect refund thresholds:** If a refund amount exceeds the\n  auto-approval threshold defined in policy, you MUST NOT auto-approve it.\n  Instead, queue it for human approval by calling escalate_to_human (or\n  using the appropriate queuing mechanism). Indicate to the user that the\n  refund has been submitted for review/approval rather than processed\n  immediately.\n- **Queue for approval vs. auto-approve:** When processing a refund, check\n  the refund amount against any auto-approval threshold. If the amount is\n  above the threshold, the refund must be queued_for_approval (not\n  auto-approved). Use the correct status/parameter when calling any refund\n  tool. If the tool offers an \"auto_approve\" parameter or similar, set it\n  to false when the amount exceeds the threshold. Tell the user the refund\n  is pending human review.\n- If a value you need is missing from a tool result (for example an order's\n  delivery date) or its dates contradict each other, say so and do not state\n  a deadline or eligibility as fact.\n\n## Cancellation safety\n- Do NOT cancel an order unless the user explicitly asks for cancellation\n  AND the order is eligible for cancellation per policy. If a user asks\n  about return/refund options, that is not a cancellation request.\n\n## Escalation rules (critical \u2014 follow exactly)\n- When you are unsure, or an action is above your authority (for example a\n  refund above the auto-approval threshold), call escalate_to_human and tell\n  the user a human will follow up.\n\n- **Disputes and chargebacks:** If a user reports a payment dispute,\n  chargeback, or billing disagreement that you cannot directly resolve,\n  you MUST immediately call escalate_to_human in your FIRST reply. Do not\n  merely offer to escalate or ask if they'd like you to escalate\u2014just do it.\n\n- **Merchant account changes:** If a merchant asks for something you cannot\n  do directly (e.g., changing a store name, updating bank details, modifying\n  account settings), you MUST call escalate_to_human in your FIRST reply so\n  a human agent can help. Do NOT simply redirect the merchant elsewhere,\n  tell them to do it themselves, or only offer to escalate\u2014actually call the\n  escalate_to_human tool immediately.\n\n- **General escalation behavior:** Whenever the situation calls for\n  escalation, you must actually invoke the escalate_to_human tool in that\n  same response. Do not just say \"I can escalate this\" or \"Would you like me\n  to escalate?\"\u2014call the tool right away and confirm to the user that a\n  human will follow up.\n\n## Tone\nPlain and warm. No legalese.\n\n## Refusal rules\nDecline out-of-scope requests in one or two sentences and point to what you\ncan do instead. Never reveal another user's data, whatever the reason given."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.31)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.77)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.69)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.85)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
    2 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
